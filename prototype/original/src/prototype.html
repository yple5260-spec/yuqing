<div class="topbar"><div class="brand"><span class="brandmark"><app-icon name="shield"></app-icon></span>外部舆情评估系统 <span class="demo">交互演示</span></div><label aria-label="切换演示身份"><select v-model="state.actorId"><option v-for="a in actors" :value="a.id">{{a.name}} · {{a.role}}</option></select></label></div>
<div class="shell"><nav class="sidebar" aria-label="系统导航"><button v-for="m in menus" :class="{active:state.menu===m.id}" @click="switchMenu(m.id)"><app-icon :name="m.icon"></app-icon>{{m.label}}</button><div class="nav-note">规则 V0.1 · 待审批<br>全部业务数据为构造数据<br>本地保存，无真实外部写入</div></nav>
<main class="main">
<div class="page-head"><div><h1>{{currentMenu.title}}</h1><p>{{currentMenu.desc}}</p></div><div class="head-actions"><button v-if="state.menu==='overview'" @click="open('intake')" class="primary" data-k="④">录入事件</button><button v-if="state.menu==='links'" @click="open('intake')" class="primary" data-k="④">录入链接</button><button @click="guide=!guide" :aria-expanded="guide">演示导览</button><button v-if="['overview','links'].includes(state.menu)" class="num-link" @click="focusNum('④')" aria-label="查看录入需求说明">④</button></div></div>
<div class="rule-strip"><span>评估基准：2026-10-29 10:00 · 北京时间</span><b>V0.1 演示规则，待业务审批</b></div>
<div v-if="guide" class="help-guide"><span>推荐路径：周女士（正常闭环）→ 刘先生（跨档缺失）→ 陈女士（同档缺失）→ 吴女士（已同步后更正）。顶栏可切换不同演示人员。</span><button @click="selectCase(0,'assessment');guide=false">开始演示</button></div>

<template v-if="state.menu==='overview'">
 <div class="filters" data-k="①"><input aria-label="事件或用户关键词" v-model="query.keyword" placeholder="搜索事件、用户、编号" @keyup.enter="applyQuery"><select aria-label="平台筛选" v-model="query.platform"><option value="">全部平台</option><option v-for="p in platforms">{{p}}</option></select><select aria-label="评估状态筛选" v-model="query.status"><option value="">全部评估状态</option><option v-for="s in statuses">{{s}}</option></select><button @click="resetQuery">重置</button><button @click="applyQuery" class="primary">查询</button><button class="num-link" @click="focusNum('①')" aria-label="查看台账需求说明">①</button></div>
 <div class="metric-row" data-k="②"><button @click="focusFilter('all')"><div class="metric-line"><strong>{{filteredRows.length}}</strong><span>用户事件评估</span></div><small>{{new Set(filteredRows.map(r=>r.eventId)).size}} 个事件 · {{linkCount}} 条纳库链接</small></button><button @click="focusFilter('review')"><div class="metric-line"><strong>{{filteredRows.filter(r=>r.state==='待复核').length}}</strong><span>待复核</span></div><small>待人工审核确认</small></button><button @click="focusFilter('blocked')"><div class="metric-line"><strong>{{filteredRows.filter(r=>r.binding!=='已确认'||r.state==='证据不足').length}}</strong><span>待补证 / 核实</span></div><small>保留未知，不默认判蓝</small></button><button @click="focusFilter('sync')"><div class="metric-line"><strong>{{filteredRows.flatMap(r=>r.tasks).filter(t=>['待同步','待核对','待更正','更正待核对','同步失败'].includes(t.state)).length}}</strong><span>同步待办任务</span></div><small>含待核对与待更正</small></button></div>
 <div class="charts" data-k="②"><section class="panel"><div class="panel-head"><h2>已确认风险分布<button class="num-link" @click="focusNum('②')" aria-label="查看态势统计需求说明">②</button></h2><small>{{confirmedRows.length}} 份有效结果</small></div><div class="panel-body"><button class="bar-row" v-for="g in grades" @click="focusFilter(g)"><span>{{g}}</span><div class="bar-track"><div class="bar-fill" :style="{width:(confirmedRows.filter(r=>r.finalGrade===g).length/Math.max(confirmedRows.length,1)*100)+'%',background:colors[g]}"></div></div><b>{{confirmedRows.filter(r=>r.finalGrade===g).length}}</b></button><p class="chart-foot">只统计当前有效已确认版本；证据不足与未评估不纳入分色。</p></div></section>
 <section class="panel"><div class="panel-head"><h2>传播观测与平台</h2><small>已纳库样本</small></div><div class="panel-body"><svg class="line-chart" viewBox="0 0 320 130" role="img" aria-label="同一批有双快照链接的累计互动量"><path d="M35 10 V105 H305 M35 58 H305" fill="none" stroke="#d7e1ec" stroke-width="1"/><path :d="trendPath" fill="none" stroke="#1c5fb6" stroke-width="3"/><circle cx="45" :cy="trendY(trend[0])" r="4" fill="#1c5fb6"/><circle cx="290" :cy="trendY(trend[1])" r="4" fill="#1c5fb6"/><text x="40" :y="trendY(trend[0])-9" fill="#34546f" font-size="11">{{trend[0].toLocaleString()}}</text><text x="245" :y="trendY(trend[1])-9" fill="#34546f" font-size="11">{{trend[1].toLocaleString()}}</text><text x="35" y="124" fill="#526b81" font-size="11">前次观测</text><text x="238" y="124" fill="#526b81" font-size="11">后次观测</text></svg><div class="platform-row" v-for="p in platformCounts"><span><i></i>{{p.name}}</span><b>{{p.count}} 条</b></div><p class="chart-foot">{{pairedCount}} 条有效双快照的累计互动之和；观测范围 {{trendTime}}。各链接时点可能不同，不代表统一日趋势。</p></div></section></div>
 <div class="section-title"><h2>事件研判台账<button class="num-link" @click="focusNum('③')" aria-label="查看事件办理入口需求说明">③</button> <span class="status">{{scopeLabel}}</span></h2><button v-if="activeFilter!=='all'" class="text" @click="focusFilter('all')">清除快捷筛选</button></div>
 <div class="table-wrap" data-k="③"><table><thead><tr><th>事件 / 用户</th><th>传播风险</th><th>评估状态</th><th>同步状态</th><th>办理</th></tr></thead><tbody><tr v-for="r in pagedRows" :key="r.id"><td><button class="text main-text" @click="choose(r,'assessment')">{{r.title}}</button><span class="sub-text">{{r.id}} · {{r.name}} · {{r.platform}}</span></td><td><span :class="['status','dot',tone(r.state==='已确认'?r.finalGrade:r.result?.grade)]">{{r.state==='已确认'?r.finalGrade:r.result?.grade? r.result.grade+'建议':'待判断'}}</span><span class="sub-text">{{r.result?rangeText(r.result)+' 分':'尚未计算'}}{{r.result?.limited?' · 证据有限':''}}</span></td><td><span :class="['status',tone(r.state)]">{{r.state}}</span><span class="sub-text" v-if="r.binding!=='已确认'">绑定{{r.binding}}</span></td><td><span :class="['status',tone(syncState(r))]">{{syncState(r)}}</span></td><td><button class="text" @click="choose(r,r.binding!=='已确认'?'links':r.state==='已确认'?'sync':'assessment')">查看办理</button></td></tr></tbody></table><div v-if="!filteredRows.length" class="empty">没有符合条件的记录，请调整筛选。</div></div>
 <div class="pagination"><span>共 {{filteredRows.length}} 条 · 每页 5 条</span><div><button :disabled="page<=1" @click="page--" aria-label="上一页">‹</button><button v-for="p in Math.max(1,Math.ceil(filteredRows.length/5))" :class="{primary:page===p}" @click="page=p">{{p}}</button><button :disabled="page>=Math.ceil(filteredRows.length/5)" @click="page++" aria-label="下一页">›</button></div></div><p class="scope">统计范围：当前筛选的构造用户事件；评估时点固定。点击指标查看相关明细，图表与台账同步反映当前筛选范围。</p>
</template>

<template v-else-if="state.menu!=='rules'">
 <div class="context"><select v-model="state.selected" aria-label="选择当前用户事件"><option v-for="r in state.rows" :value="r.id">{{r.name}} · {{r.title}} · {{r.id}}</option></select><div class="context-meta"><span>{{cur.userId}}</span><span>{{cur.phone||'手机号待补充'}}</span><span>绑定：{{cur.binding}} / v{{cur.bindingVersion}}</span><span>结果：v{{cur.version}}</span><span :class="['status',tone(cur.state)]">{{cur.state}}</span></div></div>
 <ol class="flow" aria-label="当前办理进度"><li v-for="(step,i) in flowSteps" :class="{done:step.done}"><i>{{i+1}}</i>{{step.label}}</li></ol>

 <template v-if="state.menu==='links'">
  <section class="panel" data-k="①"><div class="panel-head"><h2>用户关联核实<button class="num-link" @click="focusNum('①')">①</button></h2><span :class="['status',tone(cur.binding)]">{{cur.binding}}</span></div><div class="panel-body"><dl class="facts"><dt>用户标识</dt><dd>{{cur.userId}} · {{cur.name}}</dd><dt>手机号</dt><dd>{{cur.phone||'待补充'}}（演示脱敏值）</dd><dt>绑定依据</dt><dd>{{cur.bindingSource||'未登记'}}</dd><dt>关联版本</dt><dd>v{{cur.bindingVersion}} · {{cur.bindingHistory.length}} 条变更记录</dd></dl><div v-if="cur.binding!=='已确认'" class="notice">{{cur.binding==='存在争议'?'同一账号存在归属争议，需人工核实；当前不可确认评估。':'待补充手机号来源与核验依据，当前不可形成正式用户结论。'}}</div><div class="button-row"><button class="primary" @click="open('binding')">核实 / 更正绑定</button><button class="danger" @click="open('unbind')" data-k="③">解除绑定</button><button class="num-link" @click="focusNum('③')">③</button><button @click="switchMenu('evidence')">查看证据</button></div><div v-for="h in cur.bindingHistory" class="history">{{h.at}} · {{h.actor}} · {{h.before}} → {{h.after}}<br>{{h.reason}}</div></div></section>
  <div class="section-title"><h2>已纳库链接<button class="num-link" @click="focusNum('②')">②</button></h2><button @click="open('batch')">批量导入</button></div><div class="table-wrap" data-k="②"><table><thead><tr><th>平台 / 内容</th><th>来源</th><th>快照</th><th>操作</th></tr></thead><tbody><tr v-for="c in cur.contents"><td><span>{{c.platform}}</span><span class="sub-text">{{c.id}}</span></td><td>{{c.source}}</td><td>{{c.snapshots.length}} 次</td><td><button class="text" @click="selectedContent=c.id;switchMenu('evidence')">证据详情</button></td></tr></tbody></table><div v-if="!cur.contents.length" class="empty">尚未录入链接。</div></div><div class="notice info">链接为演示构造地址，不发起外部抓取。正式系统按平台内容 ID 与规范链接去重，短链需受控解析。</div>
 </template>

 <template v-if="state.menu==='evidence'">
  <div class="section-title"><h2>证据快照与来源<button class="num-link" @click="focusNum('①')">①</button></h2><button class="primary" @click="open('snapshot')">补充指标快照</button></div>
  <label style="margin-bottom:14px">当前内容<select v-model="selectedContent"><option v-for="c in cur.contents" :value="c.id">{{c.id}} · {{c.summary.slice(0,28)}}</option></select></label>
  <section class="panel" v-if="content" data-k="①"><div class="evidence"><div class="evidence-header"><span class="status blue">{{content.platform}} · {{content.source}}</span><small>发布时间 {{fmt(content.published)}}</small></div><h3>内容摘录与主要诉求</h3><p>{{content.summary}}</p><p class="scope" style="margin-top:8px">用户主张：希望说明原因并明确办理时限。演示未接入事实核验系统，摘录不代表诉求已经核实。</p><div class="section-title"><h3>原始来源</h3><span class="status">构造链接</span></div><p style="overflow-wrap:anywhere;font-size:11px">{{content.url}}</p><div class="snapshot"><div v-for="(s,i) in content.snapshots.slice(-2)"><small>观测 {{i+1}} · {{fmt(s.at)}}</small><b>{{(s.likes+s.comments+s.shares).toLocaleString()}} 次累计互动</b><span>点赞 {{s.likes}} / 评论 {{s.comments}} / 分享 {{s.shares}}</span></div></div><div v-if="content.snapshots.length<2" class="notice" data-k="③"><button class="num-link" @click="focusNum('③')">③</button> NOT_COLLECTED · 缺少有效双快照，互动频率为未知。请补充符合采样窗口的快照。</div><div v-else class="notice info" data-k="③"><button class="num-link" @click="focusNum('③')">③</button> 按同一组链接两次快照、实际间隔折算每小时；默认间隔 24 小时，允许偏差 30 分钟。指标下降或窗口异常时转为未知。</div><p class="scope">所有历史快照追加保存，不覆盖。当前内容原创属性：{{content.original?'已核验原创':'未计原创'}}。</p></div></section>
  <section class="panel" style="margin-top:18px" data-k="②"><div class="panel-head"><h2>账号与互动核验<button class="num-link" @click="focusNum('②')">②</button></h2><button @click="open('metrics')">补充核验信息</button></div><div class="panel-body"><dl class="facts"><dt>最高可见粉丝</dt><dd>{{cur.followers==null?'NOT_VISIBLE · 不可见':cur.followers.toLocaleString()}}</dd><dt>大 V 互动</dt><dd>{{cur.vKnown?vLabels[cur.v]:'DISPUTED · 身份待核实'}}</dd><dt>专业维权描述</dt><dd>{{cur.d6}} · 不计分</dd><dt>核验依据</dt><dd>{{cur.d6Note||'未填写补充描述；不得自动推断职业或动机。'}}</dd></dl></div></section><div class="button-row"><button class="primary" @click="switchMenu('assessment')">进入评估与复核</button></div>
 </template>

 <template v-if="state.menu==='assessment'">
  <div class="score-summary" data-k="①"><div><div class="score">{{rangeText(liveResult)}}<span style="font-size:13px;font-weight:400"> / 100</span></div><p>{{liveResult.limited?'存在缺失项，按分数上下界计算':'当前证据集指标完整'}} · 结果 v{{cur.version}}</p></div><div style="text-align:right"><span :class="['status','dot',tone(liveResult.grade)]">{{liveResult.grade?liveResult.grade+'建议':'证据不足'}}</span><p>{{cur.state==='已确认'?'最终等级：'+cur.finalGrade:'待人工复核确认'}}</p></div></div>
  <div v-if="liveResult.reason" class="notice">{{liveResult.reason}}。系统保留待处理记录，确认与同步均受阻断。</div>
  <section class="panel" data-k="①"><div class="panel-head"><h2>六维评估依据<button class="num-link" @click="focusNum('①')">①</button></h2><small>规则 {{rules.id}}</small></div><div class="table-wrap" style="border:0;border-radius:0"><table class="score-rows"><thead><tr><th>维度</th><th>观测值 / 口径</th><th>得分 / 上限</th></tr></thead><tbody><tr v-for="(d,i) in dimensions"><td>{{d.name}}</td><td>{{valueText(liveResult.values[i],i)}}<span class="sub-text">{{d.caption}}</span></td><td>{{scoreText(liveResult.ranges[i])}} / {{rules.max[i]}}<div class="score-meter"><i :style="{width:(liveResult.ranges[i][0]/rules.max[i]*100)+'%'}"></i></div></td></tr><tr><td>D6 专业维权描述</td><td>{{cur.d6}}<span class="sub-text">仅记录可核验特征，不推断动机</span></td><td>不计分</td></tr></tbody></table></div><div class="panel-body"><p class="scope">D1：近7天纳库发布；D4：近30天去重原创。仅代表本事件已纳库证据，不能推断账号全部发布量。</p></div></section>
  <div class="button-row" data-k="②"><button class="primary" @click="calculate">计算并提交复核</button><button @click="open('review')">复核办理</button><button @click="reassess">发起重评</button><button class="num-link" @click="focusNum('②')">②</button><button v-if="cur.state==='已确认'" @click="switchMenu('sync')">进入同步</button></div>
  <section class="panel" style="margin-top:20px" data-k="③"><div class="panel-head"><h2>复核与版本轨迹<button class="num-link" @click="focusNum('③')">③</button></h2><small>历史只读保留</small></div><div class="panel-body"><dl class="facts"><dt>提交人</dt><dd>{{actorName(cur.submitter)}}</dd><dt>复核人</dt><dd>{{actorName(cur.reviewer)}}</dd><dt>当前状态</dt><dd>{{cur.state}}</dd><dt>复核意见</dt><dd>{{cur.reviewNote||'尚未填写'}}</dd></dl><div v-for="h in cur.history.slice().reverse()" class="history">结果 v{{h.version}} · {{h.state}} · {{h.at}}<br>{{h.reason}} · {{h.result?rangeText(h.result)+'分':'未生成分数'}}</div></div></section>
 </template>

 <template v-if="state.menu==='sync'">
  <section class="panel" data-k="①"><div class="panel-head"><h2>已确认结果摘要<button class="num-link" @click="focusNum('①')">①</button></h2><span :class="['status',tone(cur.state)]">{{cur.state}}</span></div><div class="panel-body"><div class="summary-copy">{{summary(cur)}}</div><div class="button-row"><button @click="copySummary">复制摘要</button><button @click="downloadSummary">导出摘要</button><button class="primary" @click="generateTask">生成同步任务</button></div><p class="scope" style="margin-top:10px">复制或导出不改变同步状态。目标系统由人员手动录入，本演示不会对外写入。</p></div></section>
  <div class="section-title"><h2>同步与更正任务<button class="num-link" @click="focusNum('②')">②</button></h2><small>{{cur.tasks.length}} 条任务</small></div>
  <section v-for="t in cur.tasks" class="task" data-k="②"><div class="task-head"><h3>{{t.id}}</h3><span :class="['status',tone(t.state)]">{{t.state}}</span></div><dl class="facts"><dt>结果版本 / 等级</dt><dd>v{{t.version}} / {{t.grade}}</dd><dt>目标记录</dt><dd>{{t.receipt?.no||'未登记'}}</dd><dt>录入人 / 时间</dt><dd>{{t.receipt?actorName(t.receipt.actor)+' / '+fmt(t.receipt.at):'待手动录入后登记'}}</dd><dt>更正凭据</dt><dd>{{t.correctionReceipt?.no||'—'}}</dd><dt>核对记录</dt><dd>{{t.verifiedBy?actorName(t.verifiedBy)+' / '+t.verifiedAt:'尚未核对'}}</dd></dl><div class="button-row"><button v-if="['待同步','同步失败','待更正'].includes(t.state)" class="primary" @click="open('receipt',t)">{{t.state==='待更正'?'登记目标更正回执':'登记录入回执'}}</button><button v-if="['待核对','更正待核对'].includes(t.state)" class="primary" @click="open('verify',t)">核对并确认</button><button v-if="t.state==='待同步'" @click="open('failure',t)">登记失败</button><button v-if="['待同步','同步失败'].includes(t.state)" @click="voidTask(t)">作废任务</button><button v-if="t.state==='已同步'" @click="open('unbind')">演示错绑更正</button></div><div v-if="t.attempts.length" class="history">办理尝试 {{t.attempts.length}} 次：{{t.attempts.at(-1).note}}</div></section><div v-if="!cur.tasks.length" class="empty panel">尚未生成同步任务。请先完成有效版本的复核确认。</div><div class="notice info" data-k="③"><button class="num-link" @click="focusNum('③')">③</button> 任务状态：待同步 → 待核对 → 已同步；错误结论进入待更正 → 更正待核对 → 更正完成。旧版未执行任务冻结。</div>
 </template>
</template>

<template v-else>
 <section class="panel" data-k="①"><div class="panel-head"><h2>当前演示规则<button class="num-link" @click="focusNum('①')">①</button></h2><span class="status yellow">待业务审批</span></div><div class="table-wrap" style="border:0;border-radius:0"><table class="rule-table"><thead><tr><th>维度</th><th>分档口径</th><th>上限</th></tr></thead><tbody><tr v-for="(d,i) in dimensions"><td>{{d.name}}</td><td>{{ruleDescriptions[i]}}</td><td>{{rules.max[i]}}</td></tr><tr><td>D6 专业维权描述</td><td>未见充分证据 / 存在可核验特征 / 待核实；人工填写依据并复核。</td><td>不计分</td></tr></tbody></table></div><div class="panel-body"><div class="notice">文档与截图的 D2、D3 和大 V 门槛不一致。本演示采用需求书口径；正式规则须经业务审批。此处不提供未经审批的规则生效操作。</div><p class="scope">红色 ≥75；橙色 ≥50 且&lt;75；黄色 ≥25 且&lt;50；蓝色 &lt;25。专业维权描述不影响分数或服务权益。</p></div></section>
 <section class="panel" style="margin-top:18px" data-k="②"><div class="panel-head"><h2>平台接入与数据边界<button class="num-link" @click="focusNum('②')">②</button></h2></div><div class="panel-body"><ul class="checklist"><li v-for="p in platforms"><span>{{p}}</span><span class="status">人工录入 · 自动接入待确认</span></li></ul><p class="scope" style="margin-top:12px">当前没有真实平台采集、登录或认证；仅整理本事件已提供链接。手机号统一脱敏，演示身份切换不构成生产权限控制。</p></div></section>
 <div class="section-title"><h2>操作审计<button class="num-link" @click="focusNum('③')">③</button></h2><button @click="resetDemo">重置演示数据</button></div><div class="table-wrap" data-k="③"><table class="audit"><thead><tr><th>时间 / 人员</th><th>操作</th><th>对象</th></tr></thead><tbody><tr v-for="l in state.logs.slice().reverse().slice(0,30)"><td>{{l.at}}<span class="sub-text">{{l.actor}}</span></td><td>{{l.action}}</td><td>{{l.object}}</td></tr></tbody></table></div><p class="scope" style="margin-top:10px">仅展示本地构造操作日志；正式系统需服务端追加式审计、附件授权和加密存储。</p>
</template>
</main></div>
<div v-if="toast.message" :class="['toast',{error:toast.error}]" role="status" aria-live="polite">{{toast.message}}</div>
<div v-if="modal" class="modal-backdrop" @click.self="closeModal" @keydown.esc="closeModal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" ref="dialog"><form @submit.prevent="submitModal"><div class="modal-head"><h2 id="modalTitle">{{modalTitle}}</h2><button type="button" @click="closeModal" aria-label="关闭弹窗">×</button></div><div class="modal-body">
 <template v-if="modal==='intake'"><div class="form-grid"><label><span>事件编号</span><input v-model="form.eventId" required maxlength="60"></label><label><span>用户称呼</span><input v-model="form.name" required maxlength="30" placeholder="仅填写构造称呼"></label><label class="wide"><span>事件摘要</span><input v-model="form.title" required maxlength="100"></label><label><span>平台</span><select v-model="form.platform" required><option v-for="p in platforms">{{p}}</option></select></label><label><span>手机号（可后补）</span><input v-model="form.phone" placeholder="138****1234" maxlength="11"></label><label class="wide"><span>原始链接</span><input v-model="form.url" required maxlength="1000" placeholder="https://weibo.com/…"></label><label class="wide"><span>工单或业务来源</span><input v-model="form.source" required maxlength="150"></label></div><p class="scope" style="margin-top:12px">新记录先保存为待核实；正式评估还需绑定核验与可核验内容。不会访问输入的链接。</p></template>
 <template v-if="modal==='binding'"><div class="form-grid"><label><span>核验手机号</span><input required v-model="form.phone" maxlength="11" placeholder="138****1234"></label><label><span>绑定结论</span><select v-model="form.binding"><option>已确认</option><option>存在争议</option><option>待核实</option></select></label><label class="wide"><span>来源凭据与核验方式</span><input required v-model="form.source" maxlength="200"></label><label class="wide"><span>核验或更正说明</span><textarea required v-model="form.note" maxlength="500"></textarea></label></div><div class="notice">绑定变化会生成新版本。旧版未执行同步冻结，已同步结果进入更正队列。</div></template>
 <template v-if="modal==='unbind'"><p>将解除 {{cur.name}} 与当前手机号的关联，并将评估转为待重评。历史绑定和已同步结果保留，更正任务继续跟踪。</p><label style="margin-top:14px">解除依据与复核说明<textarea required v-model="form.note" maxlength="500" placeholder="请填写已核实的错绑依据"></textarea></label></template>
 <template v-if="modal==='batch'"><p class="scope">每行以制表符分隔：事件编号、用户称呼、事件摘要、平台、原始链接、手机号、业务来源。逐行校验，成功行不受失败行影响。</p><textarea aria-label="批量导入数据" v-model="form.batch" rows="7" style="width:100%;margin-top:12px" required></textarea><button type="button" class="text" @click="fillBatch">填入构造导入样本</button><div v-if="batchResults.length" class="notice info"><div v-for="r in batchResults">第 {{r.row}} 行：{{r.message}}</div></div></template>
 <template v-if="modal==='snapshot'"><div class="form-grid"><label class="wide"><span>内容链接</span><select v-model="form.contentId"><option v-for="c in cur.contents" :value="c.id">{{c.id}}</option></select></label><label class="wide"><span>内容摘录 / 可核验摘要</span><textarea v-model="form.summary" required maxlength="1500"></textarea></label><label><span>发布时间（北京时间）</span><input type="datetime-local" v-model="form.published" required></label><label><span>观测时间（北京时间）</span><input type="datetime-local" v-model="form.at" required></label><label><span>累计点赞</span><input type="number" min="0" step="1" v-model.number="form.likes" required></label><label><span>累计评论</span><input type="number" min="0" step="1" v-model.number="form.comments" required></label><label><span>累计转发 / 分享</span><input type="number" min="0" step="1" v-model.number="form.shares" required></label><label><span>原创属性</span><select v-model="form.original"><option :value="true">已核验原创</option><option :value="false">不计原创</option></select></label><label class="wide"><span>快照来源与依据</span><input v-model="form.note" required maxlength="300"></label></div><p class="scope" style="margin-top:12px">只追加快照，不修改旧快照。为重现24小时窗口可填入构造历史时间，观测不得晚于评估基准时点。</p></template>
 <template v-if="modal==='metrics'"><div class="form-grid"><label><span>最高可见粉丝量</span><input type="number" min="0" step="1" v-model="form.followers" placeholder="留空表示不可见"></label><label><span>大 V 互动</span><select v-model="form.v"><option v-for="(v,k) in vLabels" :value="k">{{v}}</option><option value="unknown">身份待核实</option></select></label><label class="wide"><span>D6 描述（不计分）</span><select v-model="form.d6"><option>未见充分证据</option><option>存在可核验特征</option><option>待核实</option></select></label><label class="wide"><span>核验依据</span><textarea v-model="form.note" required maxlength="500"></textarea></label></div></template>
 <template v-if="modal==='review'"><div class="notice info">当前办理人：{{actor.name}}（{{actor.role}}）；提交人：{{actorName(cur.submitter)}}。原始分数 {{rangeText(liveResult)}}，建议 {{liveResult.grade||'证据不足'}}。</div><div class="form-grid"><label><span>复核动作</span><select v-model="form.action"><option>通过</option><option>退回</option><option>调整后通过</option></select></label><label v-if="form.action==='调整后通过'"><span>调整后等级</span><select v-model="form.grade"><option v-for="g in grades">{{g}}</option></select></label><label class="wide"><span>{{form.action==='调整后通过'?'调整依据与审批记录':'复核意见'}}</span><textarea v-model="form.note" required maxlength="700"></textarea></label></div><div v-if="liveResult.reason" class="notice">{{liveResult.reason}}，不能强行确认。</div></template>
 <template v-if="modal==='receipt'"><div class="notice info">{{activeTask.state==='待更正'?'请先在目标系统完成更正，再登记更正记录；提交后仍须核对。':'请先按已确认版本手动录入目标系统，再登记回执。'}}任务 {{activeTask.id}}</div><div class="form-grid"><label><span>目标记录号 / 更正凭据号</span><input required v-model="form.no" maxlength="100"></label><label><span>目标录入时间（北京时间）</span><input required type="datetime-local" v-model="form.at"></label><label class="wide"><span>办理说明</span><textarea required v-model="form.note" maxlength="500"></textarea></label></div></template>
 <template v-if="modal==='verify'"><p>请对照目标系统核对以下内容，确认后将记录核对人与时间。</p><ul class="checklist"><li><span>用户与手机号</span><b>{{activeTask.subject?.name||cur.name}} · {{activeTask.subject?.phone||cur.phone||'按历史绑定核对'}}</b></li><li><span>任务版本与原等级</span><b>v{{activeTask.version}} · {{activeTask.grade}}</b></li><li><span>目标记录 / 更正凭据</span><b>{{(activeTask.state==='更正待核对'?activeTask.correctionReceipt:activeTask.receipt)?.no}}</b></li></ul><label style="margin-top:14px;display:block"><input type="checkbox" v-model="form.checked" required> 已核对用户、等级或更正内容、版本和目标录入时间</label></template>
 <template v-if="modal==='failure'"><label>失败原因<textarea v-model="form.note" required maxlength="500" placeholder="说明失败原因，保留原任务后续重试"></textarea></label></template>
 <div v-if="modalError" class="form-error" role="alert">{{modalError}}</div>
 </div><div class="modal-foot"><button type="button" @click="closeModal">{{modal==='batch'?'关闭':'取消'}}</button><button class="primary" type="submit">{{modal==='batch'?'逐行校验并导入':modal==='review'?'提交复核结果':modal==='verify'?'确认核对':'保存'}}</button></div></form></section></div>
